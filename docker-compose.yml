services:
  mongodb:
    image: mongo:8-noble
    container_name: bugsense-mongodb
    restart: unless-stopped
    # Bound to the host's loopback only: the database has no authentication, so
    # it must not be reachable from the network. Containers reach it over
    # bugsense-network regardless of this mapping.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bugsense-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bugsense-server
    restart: unless-stopped
    # Only reached through the client container's nginx; the SDK and sockets go
    # through it as well.
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/bugsense
      # Override these in a root .env file (see .env.example). The JWT default
      # is for local demo use only and must not be used for a real deployment.
      - JWT_SECRET=${JWT_SECRET:-bugsense_local_demo_secret_change_me}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - TELEMETRY_INGEST_KEY=${TELEMETRY_INGEST_KEY:-}
      - TELEMETRY_ALLOWED_ORIGINS=${TELEMETRY_ALLOWED_ORIGINS:-}
      - TELEMETRY_AI_HOURLY_BUDGET=${TELEMETRY_AI_HOURLY_BUDGET:-20}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - bugsense-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Relative base URL so requests go through nginx, which proxies
        # /api, /uploads, /sdk and /socket.io to the server container.
        - VITE_API_URL=/api
    container_name: bugsense-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - bugsense-network

networks:
  bugsense-network:
    driver: bridge

volumes:
  mongo-data:
