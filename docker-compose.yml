services:
  mongodb:
    # 7.0, not 8.x: MongoDB 8.0 and later refuse to start on Linux kernel 6.19
    # and newer (https://jira.mongodb.org/browse/SERVER-121912), which current
    # CI runners and up-to-date Linux hosts run. 7.0 is unaffected and supported
    # by Mongoose 8. A data volume created by 8.x cannot be opened by 7.0; reset
    # it with `docker compose down -v` (the demo data is re-seeded).
    image: mongo:7.0
    container_name: bugsense-mongodb
    restart: unless-stopped
    # Not published on a host port: the server reaches it over bugsense-network
    # and the seed runs inside the server container, so nothing on the host
    # needs it. Publishing 27017 would also clash with a locally installed
    # MongoDB. To inspect the data with Compass, see "Run with Docker" in the
    # README (a docker-compose.override.yml that maps it to 127.0.0.1:27018).
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bugsense-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bugsense-server
    restart: unless-stopped
    # Only reached through the client container's nginx; the SDK and sockets go
    # through it as well.
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Exactly one proxy (the client container's nginx) sits in front.
      - TRUST_PROXY=1
      - MONGO_URI=mongodb://mongodb:27017/bugsense
      # Override these in a root .env file (see .env.example). The JWT default
      # is public, so the server only accepts it because of
      # ALLOW_INSECURE_JWT_SECRET below (and logs a warning). For any real
      # deployment set JWT_SECRET to `openssl rand -hex 32` and
      # ALLOW_INSECURE_JWT_SECRET=false.
      - JWT_SECRET=${JWT_SECRET:-bugsense_local_demo_secret_change_me}
      - ALLOW_INSECURE_JWT_SECRET=${ALLOW_INSECURE_JWT_SECRET:-true}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Where the dashboard is served (the client container's host port);
      # used for CORS and for links in alerts and GitHub issues.
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
      - TELEMETRY_INGEST_KEY=${TELEMETRY_INGEST_KEY:-}
      - TELEMETRY_ALLOWED_ORIGINS=${TELEMETRY_ALLOWED_ORIGINS:-}
      - TELEMETRY_AI_HOURLY_BUDGET=${TELEMETRY_AI_HOURLY_BUDGET:-20}
      - REPORT_AI_HOURLY_BUDGET=${REPORT_AI_HOURLY_BUDGET:-100}
      # Local demo: visitors may sign up as developers (production default: no).
      - ALLOW_DEVELOPER_SIGNUP=${ALLOW_DEVELOPER_SIGNUP:-true}
      # Lets `npm run seed` create the demo accounts (published password) even
      # though NODE_ENV is production. Set false for anything that is not a demo.
      - ALLOW_DEMO_SEED=${ALLOW_DEMO_SEED:-true}
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_ALLOWED_REPOS=${GITHUB_ALLOWED_REPOS:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bugsense-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Relative base URL so requests go through nginx, which proxies
        # /api, /uploads, /sdk and /socket.io to the server container.
        - VITE_API_URL=/api
        # Same value as the server's key, so the SDK Playground keeps working.
        - VITE_TELEMETRY_INGEST_KEY=${TELEMETRY_INGEST_KEY:-}
        # Shows the seeded demo accounts on the sign-in page.
        - VITE_DEMO_MODE=${DEMO_MODE:-true}
    container_name: bugsense-client
    restart: unless-stopped
    # 8080, not 5173: this is nginx serving a production build, and 5173 is
    # Vite's dev-server port, likely already taken on a developer's machine.
    ports:
      - "8080:80"
    # Start once the API answers, so the first page load never hits a 502 from
    # nginx proxying to a server that is still connecting to MongoDB.
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bugsense-network

networks:
  bugsense-network:
    driver: bridge

volumes:
  mongo-data:
