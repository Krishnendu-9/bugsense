services:
  mongodb:
    image: mongo:8-noble
    container_name: bugsense-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bugsense-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bugsense-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/bugsense
      # Override these in a root .env file (see .env.example). The defaults are
      # for local demo use only and must not be used for a real deployment.
      - JWT_SECRET=${JWT_SECRET:-bugsense_local_demo_secret_change_me}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - bugsense-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Relative base URL so requests go through nginx, which proxies
        # /api, /uploads, /sdk and /socket.io to the server container.
        - VITE_API_URL=/api
    container_name: bugsense-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - bugsense-network

networks:
  bugsense-network:
    driver: bridge

volumes:
  mongo-data:
