server {
    listen 80;
    server_name localhost;

    # Must exceed the API's 5MB upload limit, otherwise nginx rejects image
    # uploads before they reach Express. nginx's default is 1MB.
    client_max_body_size 6m;

    # Shared by every proxied location: the API trusts one proxy hop
    # (app.set('trust proxy', 1)) and reads the client address from here, which
    # is what keeps rate limiting per user instead of one bucket for everyone.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The dashboard. The session token lives in localStorage, so injected
    # script would mean account takeover; the policy allows script from this
    # origin only, and nothing inline. Everything the app talks to (API,
    # sockets, uploads, the SDK script) is this origin, through the locations
    # below. 'unsafe-inline' for styles is for the toast and editor libraries,
    # which inject <style> tags; data: in connect-src is for turning the
    # annotation canvas into a file. The API sets its own headers (helmet), so
    # these are only on the static app, not repeated on proxied responses.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /api/ {
        proxy_pass http://server:5000/api/;
    }

    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
    }

    # Embeddable client SDK, served by Express from server/public/sdk.
    location /sdk/ {
        proxy_pass http://server:5000/sdk/;
    }

    location /socket.io/ {
        proxy_pass http://server:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
}
