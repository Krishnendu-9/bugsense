<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#09090B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BugSense — Smart Bug Reporting & AI Debug Assistant for development teams" />
    <title>BugSense</title>
    <script>
      /*
       * Sets data-theme before the first paint, so the page never flashes the
       * wrong palette while the bundle loads. Deliberately duplicated from
       * src/utils/theme.js (resolveInitialTheme) rather than imported: a module
       * import would run after paint, which is the whole problem. Keep the two
       * in step.
       */
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem('bugsense:theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          /* blocked site data -- fall through to the system preference */
        }
        if (!theme) {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
