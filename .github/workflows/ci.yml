name: BugSense CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # New advisories are published against lockfiles nobody has touched, so a
  # push-only audit would never see them. Weekly, Monday 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # Dependency advisories. Two thresholds, because the two halves of the tree
  # carry different risk:
  #   - Runtime dependencies (what ships in the server process and the browser
  #     bundle) fail at moderate. The sanitize-html XSS bypasses that the
  #     rich-text defence depends on were rated moderate, so a high-only gate
  #     would have let them through.
  #   - Dev-only dependencies (build, lint, test tooling) fail only at critical,
  #     which is also how npm rates malware advisories: that tooling runs on CI
  #     runners and developer machines. Lower dev advisories are mostly DoS on
  #     inputs we write ourselves; they are printed in the log but do not block.
  # Accepted advisories, and why, are listed in docs/ARCHITECTURE.md.
  # npm audit reads package-lock.json, so this job needs no install.
  audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [server, client]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Runtime dependencies (fail on moderate or above)
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=moderate

      - name: All dependencies (fail on critical, report the rest)
        if: always()
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=critical


  server:
    name: Server (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The exact floor in package.json engines (sanitize-html needs
        # >=22.12, jsdom ^22.13), and the LTS the Docker images run.
        node-version: ['22.13.0', 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      # API + unit tests against an in-memory MongoDB (mongodb-memory-server),
      # with a line/branch coverage report in the job log.
      - name: Test (with coverage)
        working-directory: server
        run: npm run test:coverage

  client:
    name: Client (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Same floor and LTS as the server job; vitest and jsdom set the floor
        # here.
        node-version: ['22.13.0', 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      # Component, utility and SDK tests (Vitest + React Testing Library,
      # jsdom), with a coverage summary in the job log.
      - name: Test (with coverage)
        working-directory: client
        run: npm run test:coverage

      - name: Build
        working-directory: client
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build server image
        run: docker build -t bugsense-server:ci ./server

      - name: Build client image
        run: docker build -t bugsense-client:ci ./client
